plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.group
base { archivesName = 'PlayerRevive-Fabric'
}

repositories {
	// Pin the exact Fabric CreativeCore asset.
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// CreativeCore Fabric
	modImplementation "maven.modrinth:creativecore:${project.creativecore_version}"
}

processResources {
	def version = project.mod_version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}


fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'playerrevive-tests'
        enableGameTests = true
        enableClientGameTests = true
    }
}

// Fabric's test-only network synchronizer can deadlock world loading on CI.
// Minecraft networking and all gameplay assertions remain enabled.
loom.runs.clientGameTest {
    if (System.getenv('CI') != null) {
        vmArg '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
    }
}
