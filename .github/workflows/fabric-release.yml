name: Fabric 1.21.11 build and release

on:
  push:
    branches: ['fabric-1.21.11']
    tags: ['fabric-v*']
  pull_request:
    branches: ['fabric-1.21.11']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install client test display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Build and run server tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build runGameTest --console=plain
      - name: Run Minecraft client test
        run: xvfb-run -a ./gradlew --no-daemon runClientGameTest --console=plain
      - name: Prepare release assets
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "fabric-v${version/+/-}" ]]; then
            echo "Tag does not match the built mod version" >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "build/libs/PlayerRevive-Fabric-${version}.jar" release-assets/
          cp "build/libs/PlayerRevive-Fabric-${version}-sources.jar" release-assets/
          (cd release-assets && sha256sum *.jar > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: playerrevive-fabric
          path: release-assets/*
          if-no-files-found: error
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-test-evidence
          path: |
            build/reports/
            run*/logs/
            build/run/**/logs/
            build/run/**/screenshots/
            run*/screenshots/
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/fabric-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: playerrevive-fabric
          path: release-assets
      - name: Verify uploaded artifacts
        run: cd release-assets && sha256sum -c SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: PlayerRevive Fabric ${{ github.ref_name }}
          body_path: docs/FABRIC_RELEASE_NOTES.md
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
